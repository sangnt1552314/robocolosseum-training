_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset

use_weight_normalization: true
use_weight_for_sampling: false

action_size: 32
past_action_size: 0

obs_size: 1
obs_stride_second: 0.0

val_set_proportion: 0.05
is_training_set: true


processors:

  so100:

    shape_meta: &so101_shape_meta

      action:
        - key: right_arm
          lerobot_key: action
          start_index: 0
          raw_shape: 6
          shape: 5
          time_offset: 0

        - key: right_gripper
          lerobot_key: action
          start_index: 5
          raw_shape: 6
          shape: 1
          time_offset: 0


      state:
        - key: right_arm
          lerobot_key: observation.state
          start_index: 0
          raw_shape: 6
          shape: 5
          time_offset: 0

        - key: right_gripper
          lerobot_key: observation.state
          start_index: 5
          raw_shape: 6
          shape: 1
          time_offset: 0


      images:
        - key: front_rgb
          camera_type: exterior
          lerobot_key: observation.images.front
          start_index: 0
          raw_shape: [3, 480, 640]
          shape: [3, 224, 224]
          time_offset: 0

        - key: wrist_rgb
          camera_type: wrist_right
          lerobot_key: observation.images.wrist
          start_index: 0
          raw_shape: [3, 480, 640]
          shape: [3, 224, 224]
          time_offset: 0


    action_state_transforms:
      - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
        keys:
          - right_arm


    train_transforms:
      front_rgb: ${oc.load:configs/data/_transforms.yaml,train_head}
      wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}


    val_transforms:
      front_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}


    norm_default_mode: z-score-tail

    norm_exception_mode:
      action:
        right_gripper: q01/q99
      state:
        right_gripper: q01/q99


    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter


    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger

      max_action_shape_meta: ${oc.load:configs/data/parts_meta/so101.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/so101.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/so101.yaml,merge_spec}

      merge: true


    num_obs_steps: 1
    use_stepwise_action_norm: true

    drop_high_level_prob: 1.0
    use_zh_instruction: false


embodiment_datasets:

  so100:

    type: g05.data.galaxea_lerobot_dataset.GalaxeaLerobotDataset

    embodiment_type: so100
    lerobot_ds_version: "3.0"

    shape_meta: *so101_shape_meta

    dataset_groups:
      - weight: 1.0
        dataset_dirs:
          - /scratch/e1583535/datasets/robocolosseum-so101-soccer-red_bowl-40episodes