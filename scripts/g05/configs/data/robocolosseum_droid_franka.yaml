# DROID Franka LeRobot v3 datasets (droid-open-drawer / droid-pour-water / droid-towel-in-basket)
# for G0.5, loaded via hydra.searchpath (nothing is copied into GalaxeaVLA).
# Follows the native so100 data config (relative arm joints, q01/q99 norm, no action filter), but:
#   - BaseLerobotDatasetV3 instead of SO100CanonicalLerobotDatasetV3, so lerobot_key picks the
#     camera explicitly (the so100 class guesses slots from camera names and would map both
#     left_image and right_image to exterior).
#   - 8-D state/action sliced into right_arm (7 joints) + right_gripper (1), as in libero.yaml.
#   - Cameras: left -> exterior, wrist -> wrist_left, wrist_right is a zero dummy slot (as in the
#     native droid.yaml). observation.images.right_image is not used.
#   - embodiment_type Droid_Franka reuses the pretraining embodiment prompt.
# dataset_dirs is overridden per run by the training script.
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
val_set_proportion: 0.05
is_training_set: true
embodiment_datasets:
  Droid_Franka:
    type: g05.data.base_lerobot_datasetV3.BaseLerobotDatasetV3
    embodiment_type: Droid_Franka
    lerobot_ds_version: '3.0'
    shape_meta:
      action:
      - {key: right_arm, lerobot_key: action, start_index: 0, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: right_gripper, lerobot_key: action, start_index: 7, raw_shape: 1, shape: 1, time_offset: 0}
      state:
      - {key: right_arm, lerobot_key: observation.state, start_index: 0, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: right_gripper, lerobot_key: observation.state, start_index: 7, raw_shape: 1, shape: 1, time_offset: 0}
      images:
      - {key: exterior, camera_type: exterior, lerobot_key: observation.images.left_image, start_index: 0, raw_shape: [3, 360, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: wrist_left, camera_type: wrist_left, lerobot_key: observation.images.wrist, start_index: 0, raw_shape: [3, 360, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: wrist_right, camera_type: wrist_right, dummy: true, shape: [3, 224, 224]}
    dataset_groups:
    - weight: 1.0
      dataset_dirs: [/scratch/e1583535/datasets/droid-open-drawer]
processors:
  Droid_Franka:
    shape_meta:
      action:
      - {key: right_arm, lerobot_key: action, start_index: 0, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: right_gripper, lerobot_key: action, start_index: 7, raw_shape: 1, shape: 1, time_offset: 0}
      state:
      - {key: right_arm, lerobot_key: observation.state, start_index: 0, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: right_gripper, lerobot_key: observation.state, start_index: 7, raw_shape: 1, shape: 1, time_offset: 0}
      images:
      - {key: exterior, camera_type: exterior, lerobot_key: observation.images.left_image, start_index: 0, raw_shape: [3, 360, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: wrist_left, camera_type: wrist_left, lerobot_key: observation.images.wrist, start_index: 0, raw_shape: [3, 360, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: wrist_right, camera_type: wrist_right, dummy: true, shape: [3, 224, 224]}
    action_state_transforms:
    - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
      keys:
      - right_arm
    train_transforms:
      exterior: ${oc.load:configs/data/_transforms.yaml,train_head}
      wrist_left: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      exterior: ${oc.load:configs/data/_transforms.yaml,val_exterior}
      wrist_left: ${oc.load:configs/data/_transforms.yaml,val_wrist}
    norm_default_mode: q01/q99
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter
    # Replaced by model.processor.action_state_merger (GroupedPaddingMerger, 20-D) at runtime.
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      merge: true
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/dual_arm_grouped_0409.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/dual_arm_grouped_0409.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/dual_arm_grouped_0409.yaml,merge_spec}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false
