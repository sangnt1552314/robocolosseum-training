model:
  model_path: /scratch/e1583535/models/lingbot-vla-v2-6b
  tokenizer_path: /scratch/e1583535/models/Qwen3-VL-4B-Instruct
  post_training: true
  adanorm_time: true
  config_key: LingbotVLAV2Config
  moe_implementation: fused

data:
  datasets_type: vla

  data_name: so101
  train_path: /scratch/e1583535/cache/lerobot/liu-tao/so101_dataset

  robot_config_root: ./configs/robot_configs

  joints:
    - arm.position: 14
    - effector.position: 2

  cameras:
    - camera_top
    - camera_wrist_left

  norm_type:
    - arm.position: meanstd
    - effector.position: meanstd

  norm_stats_file: assets/norm_stats/so101.json

  num_workers: 0
  use_future_image: false

train:
  output_dir: /scratch/e1583535/projects/robocolosseum-training/outputs/lingbot_so101_smoke_test

  # single-GPU smoke test
  data_parallel_mode: ddp
  enable_full_shard: false
  module_fsdp_enable: false
  use_compile: false

  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1

  # full fine-tuning
  freeze_vit: false
  freeze_vision_encoder: false
  train_expert_only: false

  enable_gradient_checkpointing: true

  tokenizer_max_length: 72

  # LingBot VLA v2 canonical representation
  action_dim: 55
  max_action_dim: 55
  max_state_dim: 55

  lr: 1.0e-5
  lr_decay_style: constant

  micro_batch_size: 1
  gradient_accumulation_steps: 1

  max_steps: 10

  ckpt_manager: dcp
  save_steps: 10
  save_epochs: 0

  enable_fp32: true
  enable_resume: false

  use_wandb: false

  # Disable auxiliary depth/video distillation for smoke test
  # align_params: {}